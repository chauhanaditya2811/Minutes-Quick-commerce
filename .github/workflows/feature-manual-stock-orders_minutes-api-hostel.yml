# Build and deploy only the Minutes backend to Azure App Service.
name: Build and deploy Minutes API to Azure

on:
  push:
    branches:
      - 'feature/manual-stock-orders'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend
        env:
          # Prisma config requires DATABASE_URL, but generation does not connect to the database.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/minutes?schema=public

      - name: Build TypeScript backend
        run: npm run build
        working-directory: backend

      - name: Prepare a self-contained production package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp package.json package-lock.json deploy/
          cp -R dist deploy/dist
          npm ci --omit=dev --prefix deploy
        working-directory: backend

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/deploy/**
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A4F5B0DC2284449B325AC5A05F9E16C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7DB609E9561E436D8FC0B50D63132063 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5EDC53F4EC5646A7A08D841FB0F936AA }}

      - name: Deploy backend package to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'minutes-api-hostel'
          slot-name: 'Production'
          package: .
